<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfits — wardrobase 案Aモック</title>
<!-- 案A（ミニマル・エディトリアル）デザインモック。PC/スマホ両対応の静的HTML。ブレークポイントはアプリ本体と同じ600px -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --tile: #eef1f6;
  --ink: #1a2333; --sub: #5a6472; --muted: #8a93a2; --faint: #b4bcc9;
  --line: #e4e7ec; --line-soft: #dfe3ea;
  --accent: #1b74ff; --accent-hover: #0d5fe8;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.header-inner { max-width: 1240px; margin: 0 auto; padding: 0 48px; height: 64px; display: flex; align-items: center; }
.logo { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.logo span { color: var(--accent); }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav a { height: 44px; padding: 0 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; color: var(--sub); border-radius: 10px; }
.nav a:hover { color: var(--ink); }
.nav a .dot { width: 4px; height: 4px; border-radius: 2px; background: transparent; }
.nav a.active { color: var(--ink); font-weight: 700; }
.nav a.active .dot { background: var(--accent); }
.logout { margin-left: 28px; font-size: 12.5px; color: var(--muted); }
.header .icon-btn { display: none; }

.icon-btn { width: 44px; height: 44px; border: 1px solid var(--line-soft); border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--sub); cursor: pointer; }
.icon-btn:hover { border-color: var(--faint); color: var(--ink); }

.page { max-width: 1240px; margin: 0 auto; padding: 40px 48px 80px; }
.folio { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid var(--ink); padding-top: 12px; margin-bottom: 26px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: var(--sub); }
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-family: var(--serif); font-size: 52px; font-weight: 500; line-height: 1.05; }
.subtitle { margin-top: 10px; font-size: 14px; color: var(--sub); }
.title-actions { display: flex; align-items: center; gap: 12px; }
.btn-primary { height: 44px; padding: 0 22px; border: none; border-radius: 22px; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 6px 16px rgba(27, 116, 255, 0.25); transition: background 120ms ease; }
.btn-primary:hover { background: var(--accent-hover); }

.timeline { max-width: 820px; margin: 36px auto 0; display: flex; flex-direction: column; gap: 26px; counter-reset: look 13; }
.day-group { counter-increment: look -1; }
.day-group { display: flex; gap: 24px; }
.day { width: 78px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
.day .num { font-family: var(--serif); font-size: 40px; font-weight: 500; line-height: 1; }
.day .wd { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.record { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 24px; cursor: pointer; transition: border-color 140ms ease, box-shadow 160ms ease; }
.record:hover { border-color: var(--accent); box-shadow: 0 8px 20px rgba(26, 35, 51, 0.06); }
.thumbs { display: flex; gap: 10px; flex-shrink: 0; }
.thumb { width: 76px; height: 76px; background: var(--tile); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #4d586b; }
.thumb svg { width: 58%; height: auto; }
.thumb.more { color: var(--sub); font-size: 13px; font-weight: 500; }
.memo { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memo::before { content: "Look " counter(look); display: block; margin-bottom: 3px; font-family: var(--serif); font-style: italic; font-size: 15px; letter-spacing: 0.08em; color: var(--muted); }
.chev { flex-shrink: 0; color: var(--faint); }

.fab { display: none; }
.tabbar { display: none; }

@media (max-width: 600px) {
  .header-inner { padding: 0 20px; height: 60px; }
  .nav, .logout { display: none; }
  .header .icon-btn { display: flex; margin-left: auto; }
  .page { padding: 20px 20px 140px; }
  .folio { padding-top: 10px; margin-bottom: 20px; font-size: 10px; letter-spacing: 0.18em; }
  h1 { font-size: 42px; }
  .subtitle { margin-top: 8px; font-size: 13px; }
  .title-actions { display: none; }
  .timeline { margin-top: 26px; gap: 22px; }
  .day-group { gap: 14px; }
  .day { width: 54px; padding-top: 8px; }
  .day .num { font-size: 30px; }
  .day .wd { font-size: 10.5px; margin-top: 5px; }
  .record { flex-direction: column; align-items: flex-start; gap: 11px; padding: 14px; border-radius: 14px; }
  .thumbs { gap: 8px; }
  .thumb { width: 62px; height: 62px; border-radius: 8px; }
  .thumb.more { font-size: 12px; }
  .memo { font-size: 12px; width: 100%; }
  .memo::before { font-size: 14px; margin-bottom: 2px; }
  .chev { display: none; }

  .fab { display: flex; position: fixed; right: 20px; bottom: calc(88px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border: none; border-radius: 28px; background: var(--accent); color: #fff; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(27, 116, 255, 0.35); cursor: pointer; z-index: 20; }
  .fab:hover { background: var(--accent-hover); }

  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--line); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; color: #9aa3b2; }
  .tabbar a .dot { width: 4px; height: 4px; border-radius: 2px; background: transparent; }
  .tabbar a.active { color: var(--ink); font-weight: 500; }
  .tabbar a.active .dot { background: var(--accent); }
}
</style>
</head>
